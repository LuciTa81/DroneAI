[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "droneai"
version = "0.1.0"
description = "Reproducible crowd-counting experiments for CCTV and drone safety monitoring"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
colab = [
  "torch>=2.6",
  "torchvision>=0.21",
  "tensorflow>=2.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
